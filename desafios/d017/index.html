<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 1 - Grid Line</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box; 
            /* Para caber em toda a borda */
        }
        .container{
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-rows: 80px 40px 1fr 40px; 
            grid-template-columns: 1fr 150px;
            gap: 5px;
        }
        .caixa{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        #Topo{
            grid-area: 1/1/2/-1;
            /* grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: -1; */
        }
        #Menu{
            grid-area: 2/1/3/-1;
            /* grid-row-start: 2;
            grid-row-end: 3;
            grid-column-start: 1;
            grid-column-end: -1; */
        }
        #Principal{
            grid-area: 3/1/-2/2;
            /* grid-row-start: 3;
            grid-row-end: -2;
            grid-column-start: 1;
            grid-column-end: 2; */
        }
        #Secundario{
            grid-area: 3/-2/-2/-1;
            /* grid-row-start: 3;
            grid-row-end: -2;
            grid-column-start: -2;
            grid-column-end: -1; */
        }
        #Rodape{
            grid-area: -2/1/-1/-1;
            /* grid-row-start: -2;
            grid-row-end: 1;
            grid-column-start: -1;
            grid-column-end: -1; */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa" id="Topo">Topo</div>
        <div class="caixa" id="Menu">Menu</div>
        <div class="caixa" id="Principal">Principal</div>
        <div class="caixa" id="Secundario">Secundario</div>
        <div class="caixa" id="Rodape">Rodape</div>
    </div>
</body>
</html>
