<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
        table{
            width: 400px;
            border-collapse: collapse;
            font-weight: bold;
        }
        tr,th,td{
            border: 1px solid black;
            padding: 5px;
        }
        th{
            background-color: rgb(61, 61, 61);
            color: white;
        }
        .Media{
            text-align: left;
        }
        .Materia{
            background-color: white;
            color: black;
        }
        .zero{
            background-color: rgb(71, 71, 71);
            color: white;
        }
    </style>
</head>
<body>
    <h1>Desafio 14</h1>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplinas</th>
                <th colspan="2" scope="colgroup">Nota</th>
                <th colspan="3" rowspan="2" scope="col">Média</th>
            </tr>
            <tr>
                <th scope="colgroup">Nota 1</th>
                <th scope="colgroup">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <th rowspan="4" class="Materia" scope="rowgroup">Exatas</th>
            <td>Matemática</td>
            <td>0.0</td>
            <td>0.0</td>
            <td colspan="3">0.0</td>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td colspan="3">0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td colspan="3">0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td colspan="3">0.0</td>
            </tr>
            <th colspan="6" class="Media" scope="row">Média de Exatas</th>
            <td class="zero">0.0</td>
            <tr>
                <th rowspan="2" class="Materia" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td colspan="3">0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td colspan="3">0.0</td>
            </tr>
            <th colspan="6" class="Media" scope="row">Média de Humanas</th>
            <td class="zero">0.0</td>
        </tbody>
    </table>
</body>
</html>
