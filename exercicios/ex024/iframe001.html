<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe{
            width: 400px;
            height: 400px;
            border: 1px dashed black;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe </h1>
    <p>
        Acessando o site do 

        <!-- 
            Tamanho padrão 300x150
            Scrolling="auto" (Padrão, se o conteudo exceder o tamanho do iframe ele irá criar a barra de rolagem)
                    "yes" (Mesmo que o conteudo coubesse no iframe irá aparecer a barra de rolagem)
                    "no" (Mesmo se o conteudo for maior que o iframe ele não vai criar a barra de rolagem)
            Frameborder só aceita 0 ou 1, 0 tira a borda.
        
        
        -->
        
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" scrolling="no">
            <a href="https://www.cursoemvideo.com" target="_blank">Curso em Video</a>
        </iframe>

        para aprender a programar.
    </p>
    <p>
        O repositório do Guanabara 
        
        <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500"> no
            <a href="https://gustavoguanabara.github.io" target="_blank">GitHub</a> 
        </iframe>

        também é bem legal!
    </p>
    <p>O site do <iframe src="https://www.google.com.br" frameborder="0"></iframe> também é muito legal, pena que não funciona dentro do iframe
    </p>
    <!-- Certos sites possuem uma proteção para ser exibido em iframes de terceiros -->
</body>
</html>
