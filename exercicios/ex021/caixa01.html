<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 { /*box-level*/

            background-color: lightgreen;
            height: 300px;
            width: 300px;
            
            border-width: 10px;
            border-style: solid;
            border-color: darkslategray;

            /* Shorthand de BORDER: 
            border: 10px solid darkslategray; */

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

            /* Shorthand de PADDING: 
            padding: 10px 10px 10px 10px;
            OBS: Se todos forem iguais basta colocar 10px.
            ex: padding: 10px
            E colocar dois será, cima e baixo é 10 e direita e esquerda é 20
            ex: padding: 10px 20px
            */
            
            /* Padding e Margin segue no sentido horario */

            margin-top: 20px;
            margin-right: 20px;
            margin-bottom: 40px;
            margin-left: 20px;

            /* Shorthand de MARGIN:
            margin: 20px auto 40px auto; */

            outline-width: 5px;
            outline-style: dashed;
            outline-color: salmon;

            /* Shorthand de OUTLINE:
            outline: 5px dashed salmon; */
        }
        a{ /*inline-level*/

            border-width: 10px;
            border-style: solid;
            border-color: red;
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">Links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
