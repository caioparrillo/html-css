<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em Css</title>
    <style>
        * { /* configuraçoes globais das CSS*/
            height: 100%;
        }
        body {
            background-image: linear-gradient( to right, #C905C7, #F9016F, #EDA26B, #FE5B18, #FD6E08);
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
</body>
</html>
